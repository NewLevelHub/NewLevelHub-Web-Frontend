name: Frontend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Quality gate — typecheck + build
  # ──────────────────────────────────────────────
  quality:
    name: Quality check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # 2. Build Docker image and push to Docker Hub
  # ──────────────────────────────────────────────
  build_and_push:
    name: Build & push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    outputs:
      pr_image_ref: ${{ steps.meta.outputs.pr_image_ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: meta
        run: |
          REGISTRY="${{ secrets.DOCKER_REGISTRY }}"
          REGISTRY="${REGISTRY:-docker.io}"
          REPO="${{ secrets.DOCKER_REPOSITORY }}"
          REPO="${REPO:-newlevelhub-web-frontend}"
          IMAGE="${REGISTRY}/${DOCKER_USERNAME}/${REPO}"
          PR_TAG="pr-${{ github.event.pull_request.number }}"
          echo "pr_image_ref=${IMAGE}:${PR_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.pr_image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 3. Deploy per-PR preview on staging
  # ──────────────────────────────────────────────
  deploy_preview:
    name: Deploy preview
    needs: build_and_push
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.action != 'closed'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose template to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.preview.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy preview environment
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ needs.build_and_push.outputs.pr_image_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: FRONTEND_IMAGE,PR_NUMBER,BRANCH_NAME,DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DEPLOY_PATH
          script: |
            set -e

            # --- slug ---
            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="fe-${TICKET}-pr${PR_NUMBER}"
            HOST_PORT=$((20000 + PR_NUMBER))
            DOMAIN="${PR_SLUG}.staging.newlevelhub.kz"

            # --- fallback image ref if output was lost (re-run) ---
            if [ -z "$FRONTEND_IMAGE" ]; then
              FRONTEND_IMAGE="${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/newlevelhub-web-frontend:pr-${PR_NUMBER}"
            fi

            echo "► Slug: $PR_SLUG | Port: $HOST_PORT | Domain: $DOMAIN"
            echo "► Image: $FRONTEND_IMAGE"

            # --- docker login ---
            echo "$DOCKER_PASSWORD" | docker login "${DOCKER_REGISTRY:-docker.io}" -u "$DOCKER_USERNAME" --password-stdin

            cd "$DEPLOY_PATH"

            # --- compose file for this PR ---
            cp docker-compose.preview.yml "docker-compose.${PR_SLUG}.yml"

            # --- pull & start ---
            export FRONTEND_IMAGE
            export CONTAINER_NAME="nlh_fe_${PR_SLUG}"
            export HOST_PORT

            docker compose -f "docker-compose.${PR_SLUG}.yml" --project-name "$PR_SLUG" pull
            docker compose -f "docker-compose.${PR_SLUG}.yml" --project-name "$PR_SLUG" up -d --force-recreate

            # --- backend preview: match by ticket (dev-XX), not by PR number ---
            # FE and BE have different PR numbers; the only stable shared key is the ticket (dev-XX).
            # We pick the first running be-dev-XX-pr*-nginx-1 container for this ticket.
            BACKEND_PORT=8080
            BE_HOST_HEADER="localhost"
            if [ "$TICKET" != "noticket" ]; then
              BE_NGINX_NAME=$(docker ps --format '{{.Names}}' | grep -E "^be-${TICKET}-pr[0-9]+-nginx-1$" | head -1 || true)
              if [ -n "$BE_NGINX_NAME" ]; then
                BE_PORT=$(docker port "$BE_NGINX_NAME" 80/tcp 2>/dev/null | head -1 | awk -F: '{print $NF}')
                if [ -n "$BE_PORT" ]; then
                  BACKEND_PORT=$BE_PORT
                  # Derive the BE domain so Django ALLOWED_HOSTS check passes
                  BE_SLUG="${BE_NGINX_NAME%-nginx-1}"
                  BE_HOST_HEADER="${BE_SLUG}.staging.newlevelhub.kz"
                  echo "► Matched backend preview $BE_NGINX_NAME → host port $BACKEND_PORT (Host: $BE_HOST_HEADER)"
                else
                  echo "► Container $BE_NGINX_NAME exists but port mapping not found; using port 8080"
                fi
              else
                echo "► No be-${TICKET}-pr*-nginx-1 running — using shared staging API on port 8080"
              fi
            else
              echo "► No ticket in branch name, using main staging backend on port 8080"
            fi

            # --- nginx vhost ---
            sudo tee "/etc/nginx/sites-available/${PR_SLUG}" > /dev/null <<NGINX_EOF
            server {
                listen 80;
                server_name ${DOMAIN};

                location / {
                    proxy_pass http://127.0.0.1:${HOST_PORT};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:${BACKEND_PORT};
                    proxy_set_header Host ${BE_HOST_HEADER};
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            NGINX_EOF

            sudo ln -sf "/etc/nginx/sites-available/${PR_SLUG}" "/etc/nginx/sites-enabled/${PR_SLUG}"
            sudo nginx -t && sudo systemctl reload nginx

            # --- SSL ---
            sudo certbot --nginx -d "${DOMAIN}" --non-interactive --agree-tos --email admin@newlevelhub.kz || true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = context.payload.pull_request.head.ref;
            const ticketMatch = branch.match(/dev-\d+/);
            const ticket = ticketMatch ? ticketMatch[0] : 'noticket';
            const slug = `fe-${ticket}-pr${prNumber}`;
            const url = `https://${slug}.staging.newlevelhub.kz`;
            const port = 20000 + prNumber;

            const body = [
              '## Frontend Preview Deployed',
              '',
              `| | |`,
              `|---|---|`,
              `| **URL** | ${url} |`,
              `| **Slug** | \`${slug}\` |`,
              `| **Port** | \`${port}\` |`,
              `| **Image** | \`pr-${prNumber}\` |`,
              '',
              `**API:** \`/api/\` проксируется на backend preview \`be-${ticket}-pr*\` (первый запущенный для этого тикета). Если такого контейнера нет — используется общий стенд на порту 8080.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes('Frontend Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ──────────────────────────────────────────────
  # 4. Destroy preview when PR is closed / merged
  # ──────────────────────────────────────────────
  destroy_preview:
    name: Destroy preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    environment: staging

    steps:
      - name: Tear down preview environment
        uses: appleboy/ssh-action@v1.2.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PR_NUMBER,BRANCH_NAME,DEPLOY_PATH,DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY
          script: |
            set -e

            TICKET=$(echo "$BRANCH_NAME" | grep -oE 'dev-[0-9]+' | head -1)
            if [ -z "$TICKET" ]; then TICKET="noticket"; fi
            PR_SLUG="fe-${TICKET}-pr${PR_NUMBER}"
            DOMAIN="${PR_SLUG}.staging.newlevelhub.kz"
            FRONTEND_IMAGE="${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/${DOCKER_REPOSITORY:-newlevelhub-web-frontend}:pr-${PR_NUMBER}"
            COMPOSE_FILE="${DEPLOY_PATH}/docker-compose.${PR_SLUG}.yml"

            echo "--- [1/5] Stopping Docker containers ---"
            cd "$DEPLOY_PATH"
            if [ -f "$COMPOSE_FILE" ]; then
              docker compose --project-name "$PR_SLUG" -f "$COMPOSE_FILE" down -v --remove-orphans \
                || echo "WARNING: compose down failed, proceeding with fallback"
              rm -f "$COMPOSE_FILE"
            else
              echo "Compose file not found, skipping compose down"
            fi

            echo "--- [2/5] Fallback: remove leftover containers/volumes/networks ---"
            CONTAINERS=$(docker ps -a --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$CONTAINERS" ]; then
              docker stop $CONTAINERS 2>/dev/null || true
              docker rm -f $CONTAINERS 2>/dev/null || true
            fi
            # also remove by name pattern
            docker ps -a --format '{{.Names}}' | grep "nlh_fe_${PR_SLUG}" | xargs -r docker rm -f || true

            VOLUMES=$(docker volume ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$VOLUMES" ]; then
              docker volume rm -f $VOLUMES 2>/dev/null || true
            fi

            NETWORKS=$(docker network ls --filter "label=com.docker.compose.project=${PR_SLUG}" -q 2>/dev/null || true)
            if [ -n "$NETWORKS" ]; then
              docker network rm $NETWORKS 2>/dev/null || true
            fi

            echo "--- [3/5] Removing nginx config ---"
            sudo rm -f "/etc/nginx/sites-available/${PR_SLUG}"
            sudo rm -f "/etc/nginx/sites-enabled/${PR_SLUG}"
            sudo nginx -t && sudo nginx -s reload

            echo "--- [4/5] Deleting SSL certificate ---"
            sudo certbot delete --cert-name "${DOMAIN}" --non-interactive 2>/dev/null \
              || echo "Cert not found or already deleted."

            echo "--- [5/5] Cleaning up Docker image ---"
            docker rmi "$FRONTEND_IMAGE" 2>/dev/null || echo "Image not found or already removed."

            echo ""
            echo "=== Preview destroyed: ${PR_SLUG} ==="

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const action = merged ? 'merged ✅' : 'closed';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes('Frontend Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `## Frontend Preview Destroyed\n\nPreview for PR #${prNumber} has been removed (PR ${action}).`,
              });
            }

  # ──────────────────────────────────────────────
  # 5. Slack notification (optional)
  # ──────────────────────────────────────────────
  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: [quality, build_and_push, deploy_preview]
    if: always() && github.event.pull_request.draft == false && github.event.action != 'closed'
    steps:
      - name: Send Slack message
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy_preview.result == 'success' && ':white_check_mark: SUCCESS' || ':x: FAILURE' }} *Frontend CI* — `${{ github.repository }}`\n*PR:* #${{ github.event.pull_request.number }} ${{ github.event.pull_request.title }}\n*Branch:* `${{ github.head_ref }}`\n*Actor:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
