name: Frontend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Build Docker image → push with :latest + :sha-*
  # ──────────────────────────────────────────────
  build_and_push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    outputs:
      latest_image_ref: ${{ steps.meta.outputs.latest_image_ref }}
      sha_image_ref: ${{ steps.meta.outputs.sha_image_ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image references
        id: meta
        run: |
          REGISTRY="${{ secrets.DOCKER_REGISTRY }}"
          REGISTRY="${REGISTRY:-docker.io}"
          REPO="${{ secrets.DOCKER_REPOSITORY }}"
          REPO="${REPO:-newlevelhub-web-frontend}"
          IMAGE="${REGISTRY}/${DOCKER_USERNAME}/${REPO}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "latest_image_ref=${IMAGE}:latest"        >> "$GITHUB_OUTPUT"
          echo "sha_image_ref=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.latest_image_ref }}
            ${{ steps.meta.outputs.sha_image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 2. Deploy to production
  # ──────────────────────────────────────────────
  deploy_production:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          LATEST_IMAGE: ${{ needs.build_and_push.outputs.latest_image_ref }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,LATEST_IMAGE,DEPLOY_PATH
          script: |
            set -e

            echo "$DOCKER_PASSWORD" | docker login "${DOCKER_REGISTRY:-docker.io}" -u "$DOCKER_USERNAME" --password-stdin

            cd "$DEPLOY_PATH"

            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "docker-compose.prod.yml not found"
              ls -la
              exit 1
            fi

            docker pull "$LATEST_IMAGE"
            docker compose -f docker-compose.prod.yml up -d --force-recreate
