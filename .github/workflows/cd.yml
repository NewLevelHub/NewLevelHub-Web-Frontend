name: Frontend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image_meta.outputs.image_ref }}
      image_sha: ${{ steps.image_meta.outputs.image_sha }}
      ticket: ${{ steps.ticket.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract ticket from commit message
        id: ticket
        # Merge commit message: "Merge pull request #N from org/feat/DEV-33-..."
        # Squash commit message: "DEV-33: Some feature (#N)"
        run: |
          TICKET="$(echo "${{ github.event.head_commit.message }}" | grep -Eo '[A-Za-z]+-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
          TICKET="${TICKET:-sha-$(echo "$GITHUB_SHA" | cut -c1-7)}"
          echo "value=${TICKET}" >> "$GITHUB_OUTPUT"

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/newlevelhub-web-frontend"
          SHA_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          echo "image_ref=${IMAGE}:prod-${{ steps.ticket.outputs.value }}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE}:prod-sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_ref }}
            ${{ steps.image_meta.outputs.image_sha }}

  deploy-production:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production   # ← GitHub pauses here and waits for Required Reviewers approval

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          FRONTEND_IMAGE: ${{ needs.build_and_push.outputs.image_ref }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,FRONTEND_IMAGE
          script: |
            set -e
            FRONTEND_IMAGE="$(printf '%s' "$FRONTEND_IMAGE" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "$FRONTEND_IMAGE" ]; then
              echo "FRONTEND_IMAGE is empty"
              exit 1
            fi
            echo "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin
            cd ~/NewLevelHub-Web-Frontend
            [ -f ".env.prod" ] || { echo ".env.prod not found"; ls -la; exit 1; }
            cat > docker-compose.prod.yml <<EOF
            services:
              frontend:
                image: ${FRONTEND_IMAGE}
                pull_policy: always
                container_name: nlh_web_prod
                restart: unless-stopped
                ports:
                  - "3001:3000"
                env_file:
                  - .env.prod
            EOF
            docker pull "$FRONTEND_IMAGE"
            docker compose -f docker-compose.prod.yml up -d --force-recreate
